<svg xmlns="http://www.w3.org/2000/svg" width="1019" height="591" viewBox="0 0 1019 591" role="img" aria-labelledby="title desc"><title id="title">Reward points and calculation rules</title><desc id="desc">Visit time bands, minus-one thresholds, zero-point ranges, complete order milestones, points awarded, examples and calculation rules.</desc><rect width="1019" height="591" fill="white"/><g font-family="Arial, sans-serif" font-size="16" fill="#25282b"><text x="22" y="41" font-weight="600">Verified Time at</text><text x="22" y="64" font-weight="600">Party’s Shop</text><text x="203" y="41" font-weight="600">Order Value for −1</text><text x="203" y="64" font-weight="600">Point</text><text x="361" y="41" font-weight="600">Order Value for 0</text><text x="361" y="64" font-weight="600">Points</text><text x="541" y="41" font-weight="600">Order Value for</text><text x="541" y="64" font-weight="600">Positive Points</text><text x="731" y="41" font-weight="600">Points</text><text x="731" y="64" font-weight="600">Awarded</text><text x="849" y="41" font-weight="600">Example</text><path d="M22 79H982" stroke="#f0f0f0"/><text x="22" y="108" font-weight="600">0–30 minutes</text><text x="203" y="108" font-weight="400">Below ₹20,000</text><text x="361" y="108" font-weight="400">₹20,000 to below</text><text x="361" y="131" font-weight="400">₹40,000</text><text x="541" y="108" font-weight="400">Every ₹40,000</text><text x="731" y="108" font-weight="400">+1 point</text><text x="849" y="108" font-weight="400">₹80,000 = 2</text><text x="849" y="131" font-weight="400">points</text><path d="M22 147H982" stroke="#f0f0f0"/><text x="22" y="176" font-weight="600">Above 30 minutes–1</text><text x="22" y="199" font-weight="600">hour</text><text x="203" y="176" font-weight="400">Below ₹75,000</text><text x="361" y="176" font-weight="400">₹75,000 to below</text><text x="361" y="199" font-weight="400">₹1,50,000</text><text x="541" y="176" font-weight="400">Every ₹1,50,000</text><text x="731" y="176" font-weight="400">+2 points</text><text x="849" y="176" font-weight="400">₹3,00,000 = 4</text><text x="849" y="199" font-weight="400">points</text><path d="M22 215H982" stroke="#f0f0f0"/><text x="22" y="244" font-weight="600">Above 1–2 hours</text><text x="203" y="244" font-weight="400">Below ₹2,00,000</text><text x="361" y="244" font-weight="400">₹2,00,000 to below</text><text x="361" y="267" font-weight="400">₹3,00,000</text><text x="541" y="244" font-weight="400">Every ₹3,00,000</text><text x="731" y="244" font-weight="400">+3 points</text><text x="849" y="244" font-weight="400">₹6,00,000 = 6</text><text x="849" y="267" font-weight="400">points</text><path d="M22 283H982" stroke="#f0f0f0"/><text x="22" y="312" font-weight="600">Above 2–3 hours</text><text x="203" y="312" font-weight="400">Below ₹3,00,000</text><text x="361" y="312" font-weight="400">₹3,00,000 to below</text><text x="361" y="335" font-weight="400">₹4,00,000</text><text x="541" y="312" font-weight="400">Every ₹4,00,000</text><text x="731" y="312" font-weight="400">+4 points</text><text x="849" y="312" font-weight="400">₹8,00,000 = 8</text><text x="849" y="335" font-weight="400">points</text><path d="M22 351H982" stroke="#f0f0f0"/><text x="22" y="380" font-weight="600">Above 3 hours</text><text x="203" y="380" font-weight="400">Below ₹4,00,000</text><text x="361" y="380" font-weight="400">₹4,00,000 to below</text><text x="361" y="403" font-weight="400">₹5,00,000</text><text x="541" y="380" font-weight="400">Every ₹5,00,000</text><text x="731" y="380" font-weight="400">+5 points</text><text x="849" y="380" font-weight="400">₹10,00,000 = 10</text><text x="849" y="403" font-weight="400">points</text><text x="22" y="458" font-size="18" font-weight="600">Point Calculation Rules</text><text x="37" y="496" font-size="18">•</text><text x="61" y="496" font-size="18"><tspan font-weight="600">−1 Point:</tspan> Order value is below the minimum requirement.</text><text x="37" y="524" font-size="18">•</text><text x="61" y="524" font-size="18"><tspan font-weight="600">0 Points:</tspan> Order value falls within the zero-point range.</text><text x="37" y="552" font-size="18">•</text><text x="61" y="552" font-size="18"><tspan font-weight="600">Positive Points:</tspan> Award points for each complete order-value milestone.</text><text x="37" y="580" font-size="18">•</text><text x="61" y="580" font-size="18"><tspan font-weight="600">No partial points:</tspan> Only complete milestones count.</text></g></svg>